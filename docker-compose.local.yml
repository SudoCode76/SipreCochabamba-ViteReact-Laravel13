services:
  backend:
    env_file:
      - ./backend/.env.local
    environment:
      APP_URL: http://localhost:8011
      FRONTEND_URL: http://localhost:8010
      SANCTUM_STATEFUL_DOMAINS: localhost:5173,localhost:8010,localhost:8011,127.0.0.1:5173,127.0.0.1:8010,127.0.0.1:8011
      SESSION_DOMAIN: ""
      SESSION_SECURE_COOKIE: "false"
      SESSION_DRIVER: file
      CACHE_STORE: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
    extra_hosts:
      - "host.docker.internal:host-gateway"

  reverb:
    env_file:
      - ./backend/.env.local
    environment:
      CACHE_STORE: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      target: dev
      args:
        VITE_API_URL: http://localhost:8011/api
        VITE_STORAGE_BASE_URL: http://localhost:8011
        VITE_GIS_BASE_URL: ""
        VITE_REVERB_APP_KEY: sipre-dev-key
        VITE_REVERB_URL: http://localhost:8011
    ports: !override
      - "8010:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: >
      sh -c 'if [ ! -d node_modules/laravel-echo ]; then npm ci; fi;
      exec npm run dev -- --host 0.0.0.0 --port 5173'

volumes:
  frontend_node_modules:
