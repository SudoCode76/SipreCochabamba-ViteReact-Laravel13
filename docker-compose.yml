services:
  db:
    image: postgres:16-bookworm
    container_name: sipre-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sipre
      POSTGRES_USER: sipre
      POSTGRES_PASSWORD: sipre
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sipre-202604201330_pg_backup.dmp:/docker-entrypoint-initdb.d/sipre-202604201330_pg_backup.dmp:ro
      - ./.docker/postgres/init/10-restore-backup.sh:/docker-entrypoint-initdb.d/10-restore-backup.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sipre-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: SipreCochabamba
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: sipre
      DB_USERNAME: sipre
      DB_PASSWORD: sipre
      DB_SSLMODE: prefer
      FRONTEND_URL: http://localhost:5173
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: sipre-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_vendor:
  postgres_data:
  frontend_node_modules:
