name: siprecochabamba-new

services:
  backend:
    build:
      context: ./backend
    container_name: sipre-backend
    restart: unless-stopped
    env_file:
      - ./.env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: sipre-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    env_file:
      - ./.env.docker
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  backend_vendor:
  frontend_node_modules:
