services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sipregamc-dev
    working_dir: /var/www
    restart: unless-stopped

    volumes:
      - ./backend:/var/www:cached
      - backend_vendor:/var/www/vendor
      - backend_storage:/var/www/storage
      - backend_cache:/var/www/bootstrap/cache
      - composer_cache:/tmp/composer

    env_file:
      - ./backend/.env.dev

    expose:
      - "9000"

    networks:
      - sipregamc-network

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sipregamc-reverb-dev
    working_dir: /var/www
    restart: unless-stopped

    command: sh -c "until [ -f vendor/autoload.php ]; do sleep 2; done; php artisan reverb:start --host=0.0.0.0 --port=8080"

    volumes:
      - ./backend:/var/www:cached
      - backend_vendor:/var/www/vendor
      - backend_storage:/var/www/storage
      - backend_cache:/var/www/bootstrap/cache

    env_file:
      - ./backend/.env.dev

    expose:
      - "8080"

    depends_on:
      - backend

    networks:
      - sipregamc-network

  nginx:
    image: nginx:alpine
    container_name: sipregamc-nginx-dev
    restart: unless-stopped

    ports:
      - "8011:80"

    volumes:
      - ./backend:/var/www
      - backend_storage:/var/www/storage
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - backend
      - reverb

    networks:
      - sipregamc-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8011/api}
        VITE_STORAGE_BASE_URL: https://sipregamcapidev.cochabamba.bo
        VITE_GIS_BASE_URL: ${VITE_GIS_BASE_URL:-}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-sipre-dev-key}
        VITE_REVERB_URL: ${VITE_REVERB_URL:-http://localhost:8011}

    container_name: sipregamc-frontend-dev

    restart: unless-stopped

    ports:
      - "8010:80"

    networks:
      - sipregamc-network

networks:
  sipregamc-network:
    driver: bridge

volumes:
  backend_vendor:
  backend_storage:
  backend_cache:
  composer_cache:
